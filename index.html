<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1F29">
<meta name="apple-mobile-web-app-title" content="BV Stats">
<title>Beach Stat Collector</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root{
    --ground:#0B1F29; --surface:#12303C; --surface2:#17414F; --line:#2A5A6B;
    --sand:#E9D5A9; --text:#EAF4F7; --muted:#7FA3B0;
    --q0:#B23A32; --q1:#D4813A; --q2:#7FB069; --q3:#2FB5A0;
    --kill:#2FB5A0; --err:#B23A32; --live:#8FA8B3; --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ground)}
  #bv{background:var(--ground);color:var(--text);min-height:100vh;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
              calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      display:flex;flex-direction:column;gap:14px;user-select:none}
  #bv .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  #bv .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
  #bv h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em}

  #bv .bar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;background:var(--surface);
           border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
  #bv .matchup{font-size:15px;font-weight:800;letter-spacing:-.02em}
  #bv .matchup em{font-style:normal;color:var(--muted);font-weight:600}
  #bv .spacer{flex:1}
  #bv .ghost{border:1px solid var(--line);background:transparent;color:var(--text);font-size:12px;
             font-weight:700;padding:8px 11px;border-radius:9px;cursor:pointer}
  #bv .ghost:active{background:var(--surface2)}
  #bv .ghost.warn{border-color:var(--err);color:#E9A49E}

  #bv .split{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:900px){#bv .split{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
  #bv .stage,#bv .panel{background:var(--surface);border:1px solid var(--line);
       border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}

  /* ---- SIGNATURE: two fixed player columns, left is left all night ---- */
  #bv .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #bv .col{display:flex;flex-direction:column;gap:7px;min-width:0}
  #bv .cap{display:flex;flex-direction:column;gap:1px;padding:0 2px 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
  #bv .cap b{font-size:19px;font-weight:800;letter-spacing:-.02em}
  #bv .cap span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
  #bv .cap.on span{color:var(--sand)}

  #bv .btn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:11px;
           padding:16px 14px;text-align:left;cursor:pointer;font-size:16px;font-weight:700;
           letter-spacing:-.01em;line-height:1.2;transition:transform .07s ease}
  #bv .btn:active{transform:scale(.97)}
  #bv .btn small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;
                 text-transform:uppercase;opacity:.62;margin-top:4px}
  #bv .btn.kill{background:var(--kill);border-color:var(--kill);color:#07201C}
  #bv .btn.err{background:var(--err);border-color:var(--err);color:#FFF0EE}
  #bv .btn.dug{background:transparent;border-color:var(--live);color:var(--live)}
  #bv .btn.bhe{background:transparent;border-color:var(--err);color:#E9A49E}
  #bv .btn.neutral{background:var(--surface2)}
  #bv .wide{width:100%;text-align:center;background:transparent;color:var(--muted);
            font-size:13px;font-weight:700;padding:12px;border:1px dashed var(--line);border-radius:11px;cursor:pointer}
  #bv .wide:active{background:var(--surface2)}
  #bv .wide.won{border-color:var(--kill);color:var(--kill)}
  #bv .wide.lost{border-color:var(--err);color:#E9A49E}
  #bv .pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}

  #bv .pass{border:0;border-radius:11px;cursor:pointer;color:#08161C;font-weight:800;
            padding:13px 12px;display:flex;align-items:center;gap:10px;text-align:left;
            transition:transform .07s ease}
  #bv .pass:active{transform:scale(.97);filter:brightness(1.12)}
  #bv .pass b{font-size:27px;line-height:1;flex:none;width:22px}
  #bv .pass span{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.78;
                 font-weight:800;line-height:1.25;min-width:0}
  #bv .p0{background:var(--q0);color:#FFF0EE}
  #bv .p1{background:var(--q1)}#bv .p2{background:var(--q2)}#bv .p3{background:var(--q3)}

  #bv .big{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:11px;
           padding:26px 16px;font-size:18px;font-weight:800;cursor:pointer;letter-spacing:-.02em}
  #bv .big:active{transform:scale(.98)}

  #bv .crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:30px;font-size:12px}
  #bv .crumb{background:var(--ground);border:1px solid var(--line);padding:5px 10px;border-radius:20px;font-weight:700}
  #bv .crumb.dim{color:var(--muted);border-style:dashed}

  #bv table{width:100%;border-collapse:collapse;font-size:13px}
  #bv th,#bv td{padding:5px 4px;text-align:right}
  #bv th:first-child,#bv td:first-child{text-align:left;color:var(--muted);font-weight:600;font-size:12px}
  #bv thead th{font-size:14px;font-weight:800;border-bottom:1px solid var(--line);padding-bottom:8px}
  #bv tr.group td{color:var(--sand);font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;padding-top:11px}
  #bv tr.tot td{border-top:1px solid var(--line);font-weight:800}
  #bv tr.rate td{color:var(--text)}
  #bv tr.rate td:first-child{color:var(--muted)}

  #bv .log{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;-webkit-overflow-scrolling:touch}
  #bv .entry{display:flex;gap:9px;align-items:center;font-size:12px;background:var(--ground);border-radius:8px;padding:7px 10px}
  #bv .dot{width:7px;height:7px;border-radius:50%;flex:none}
  #bv .entry .txt{flex:1}
  #bv .empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center;line-height:1.5}

  #bv .field{display:flex;flex-direction:column;gap:5px}
  #bv label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  #bv input[type=text],#bv input[type=date],#bv select{background:var(--ground);border:1px solid var(--line);
            color:var(--text);border-radius:9px;padding:11px 12px;font-size:16px;font-family:inherit;
            font-weight:600;width:100%}
  #bv input:focus,#bv select:focus{outline:2px solid var(--sand);outline-offset:1px}
  #bv .fields{display:grid;gap:11px;grid-template-columns:1fr 1fr}
  #bv .check{display:flex;align-items:center;gap:11px;background:var(--ground);border:1px solid var(--line);
             border-radius:11px;padding:13px;cursor:pointer;grid-column:1/-1}
  #bv .check input{width:22px;height:22px;flex:none;accent-color:var(--sand)}
  #bv .check .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
  #bv .check .lbl b{font-size:14px;font-weight:800}
  #bv .check .lbl span{font-size:11px;color:var(--muted);font-weight:600}
  #bv .primary{border:0;background:var(--sand);color:var(--ground);font-weight:800;font-size:15px;
               padding:15px;border-radius:11px;cursor:pointer;width:100%}
  #bv .primary:active{filter:brightness(.93)}
  #bv .modal{position:fixed;inset:0;background:rgba(4,14,19,.85);z-index:50;display:flex;
             align-items:flex-start;justify-content:center;padding:22px 16px;overflow-y:auto}
  #bv .sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;
             width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}
  #bv textarea{width:100%;height:180px;background:var(--ground);border:1px solid var(--line);color:var(--text);
               border-radius:9px;padding:11px;font-size:11px;font-family:ui-monospace,Menlo,monospace;white-space:pre}
  #bv .card{display:flex;align-items:center;gap:11px;background:var(--ground);border:1px solid var(--line);
            border-radius:11px;padding:12px 13px}
  #bv .card .who{flex:1;min-width:0}
  #bv .card .who b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
  #bv .card .who span{font-size:11px;color:var(--muted);font-weight:600}
  #bv .card.on{border-color:var(--sand)}
  #bv .alert{background:var(--err);color:#FFF0EE;border-radius:11px;padding:12px 13px;font-size:13px;
             font-weight:700;display:flex;gap:11px;align-items:center;line-height:1.35}
  #bv .alert button{flex:none;border:1px solid rgba(255,255,255,.5);background:transparent;color:#FFF0EE;
                    font-weight:800;font-size:12px;padding:7px 10px;border-radius:8px;cursor:pointer}
  #bv details summary::-webkit-details-marker{display:none}
  #bv details summary{list-style:none}
  #bv .chip{font-size:11px;font-weight:800;letter-spacing:.04em;padding:6px 10px;
             border:1px solid var(--line);border-radius:20px;white-space:nowrap}
  #bv .flash{animation:fl .4s ease}
  @keyframes fl{0%{background:var(--sand)}100%{background:var(--surface)}}
  @media(prefers-reduced-motion:reduce){#bv *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bv"></div>

<script src="./config.js"></script>
<script src="./sync.js"></script>

<script>
(function(){
  const $=document.getElementById('bv');
  const uid=()=>Math.random().toString(36).slice(2,10);

  const S={matches:[],cur:null,view:'library',screen:'sr1',pending:null,sheet:null,draft:null,
           filter:{player:'',oppo:''},err:null,
           sync:{state:'local',pending:0,busy:false,note:null}};

  /* Sync is layered on top of local storage and is never on the critical path
     of recording a rally — see sync.js. */
  const remote=new BVSync.Client(window.BV_CONFIG||{});

  /* ============================ STORAGE ============================
     v1 persisted through window.storage, which exists only inside the
     artifact runtime and silently no-ops anywhere else. localStorage is
     synchronous, so the write lands before the tap handler returns —
     a force-quit right after a tap cannot lose the rally.            */
  const KEY='bvstat:v2', PREV='bvstat:v2:prev', SCHEMA=3;

  function writeLocal(){
    let blob;
    try{blob=JSON.stringify({schemaVersion:SCHEMA,matches:S.matches,cur:S.cur});}
    catch(e){S.err='Could not serialize match data: '+e.message;return false;}
    try{
      const old=localStorage.getItem(KEY);
      if(old!==null)localStorage.setItem(PREV,old);
      localStorage.setItem(KEY,blob);
      if(S.err)S.err=null;
      return true;
    }catch(e){
      /* Never swallow this. Silent failure is the exact bug being fixed. */
      S.err=(e&&e.name==='QuotaExceededError')
        ? 'Storage is full — this rally was NOT saved. Export a backup, then delete old matches.'
        : 'Could not save to this device ('+((e&&e.name)||'error')+'). Export a backup now.';
      return false;
    }
  }

  function save(){const okv=writeLocal();syncSoon();return okv;}

  function load(){
    let raw=null;
    try{raw=localStorage.getItem(KEY);}
    catch(e){S.err='Could not read saved data from this device.';return;}
    if(!raw)return;
    let d;
    try{d=JSON.parse(raw);}
    catch(e){S.err='Saved data was unreadable. Import a backup to recover.';return;}
    adopt(d);
  }

  function adopt(d){
    if(!d||!Array.isArray(d.matches))return false;
    S.matches=d.matches.map(migrate);
    S.cur=d.cur||null;
    if(S.cur&&M()){S.view='collect';S.screen=screenFor(M());}
    else {S.cur=null;S.view='library';}
    return true;
  }

  /* Tolerant of v1 records: adds trackST/won, drops the old per-set field. */
  function migrate(m){
    const c=m.cfg||{};
    return{
      id:m.id||uid(),
      updatedAt:Number(m.updatedAt)||0,      // epoch ms; drives last-write-wins
      owner:m.owner||null,
      deleted:!!m.deleted,                   // tombstone, so a delete cannot resurrect
      cfg:{date:c.date||'',school:c.school||'',oppo:c.oppo||'',oppPair:c.oppPair||'',
           trackST:!!c.trackST,
           a:{num:(c.a&&c.a.num)||'',name:(c.a&&c.a.name)||''},
           b:{num:(c.b&&c.b.num)||'',name:(c.b&&c.b.name)||''}},
      scores:Array.isArray(m.scores)?[m.scores[0]||'',m.scores[1]||'',m.scores[2]||'']:['','',''],
      won:!!m.won,
      rallies:(Array.isArray(m.rallies)?m.rallies:[]).map(r=>{
        const{set,...rest}=r;                       // per-set tracking is gone in v2
        return rest;
      })
    };
  }

  const M=()=>S.matches.find(m=>m.id===S.cur);
  const live=()=>S.matches.filter(m=>!m.deleted);
  /* Stamp a match as changed on this device. Every mutation goes through here
     so the merge always has an honest timestamp to compare. */
  const touch=m=>{if(m)m.updatedAt=Date.now();return m;};
  const other=k=>k==='a'?'b':'a';
  const P=k=>M().cfg[k];
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ============ decision tree replayed over the log ============
     Aggregates are always a pure function of the rally log — never
     stored. Change a definition here and history recomputes.       */
  const ST_KEYS=['sta','stk','ste','stko','pos','stsb','stt','std','stdts',
                 'stbhe','sta2k','sta2e','sttk','stte'];
  const SUM_KEYS=['bhe','a2a','a2k','a2e','sw','fbk','fbe'].concat(ST_KEYS,['pe','pg']);

  function blank(){
    const o={sr:[0,0,0,0]};
    SUM_KEYS.forEach(k=>o[k]=0);
    return o;
  }

  function tally(rallies){
    const t={a:blank(),b:blank()};
    for(const r of rallies){
      if(r.kind==='st'){tallyST(t,r);continue;}
      if(r.kind==='oppServeError')continue;      // team point, attributed to nobody
      const p=t[r.passer],q=t[other(r.passer)];
      p.sr[r.rating]++;
      if(r.rating===0){p.pg++;continue;}
      if(r.second==='bhe'){q.bhe++;q.pg++;}
      else if(r.second==='option'){q.a2a++;
        if(r.result==='kill'){q.a2k++;q.pe++;}else if(r.result==='error'){q.a2e++;q.pg++;}}
      else if(r.second==='attack'){p.sw++;
        if(r.result==='kill'){p.fbk++;p.pe++;}else if(r.result==='error'){p.fbe++;p.pg++;}}
    }
    return t;
  }

  /* POS always credits whoever served this rally, never the actor —
     it is a serve-turn stat, not personal credit. Opponent kills and
     opponent errors never touch pe/pg: points come only from our own
     players' actions on the ball. */
  function tallyST(t,r){
    const srv=t[r.server];
    for(const e of r.events||[]){
      if(e.t==='serve'){
        srv.sta++;
        if(e.result==='ace'){srv.stk++;srv.pos++;srv.pe++;}
        else if(e.result==='error'){srv.ste++;srv.pg++;}
        else if(e.result==='knockout'){srv.stko++;}
      }
      else if(e.t==='block'){
        const x=t[e.by];
        if(e.result==='stuff'){x.stsb++;srv.pos++;x.pe++;}
        else{x.stt++;x.pg++;}
      }
      else if(e.t==='dig'){
        const x=t[e.by];x.std++;if(e.toSwing)x.stdts++;   // dig-to-swing counts in BOTH
      }
      else if(e.t==='attack'){
        const x=t[e.by];
        if(e.type==='optionA2'){
          if(e.result==='kill'){x.sta2k++;srv.pos++;x.pe++;}
          else if(e.result==='error'){x.sta2e++;x.pg++;}
          else if(e.result==='bhe'){x.stbhe++;x.pg++;}
        }else{
          if(e.result==='kill'){x.sttk++;srv.pos++;x.pe++;}
          else if(e.result==='error'){x.stte++;x.pg++;}
        }
      }
      else if(e.t==='opp'){
        if(e.result==='error')srv.pos++;                  // we won the rally; nobody is credited
      }
    }
  }

  const add=(x,y)=>{x.sr=x.sr.map((v,i)=>v+y.sr[i]);SUM_KEYS.forEach(k=>x[k]+=y[k]);return x;};
  const srTotal=s=>s.sr.reduce((a,b)=>a+b,0);

  /* ============ SR statistics ============
     Sum raw counts first, divide once. Never average a percentage. */
  const ratio=(num,den)=>den>0?num/den:null;
  const asPct=v=>v==null?'—':(v*100).toFixed(1)+'%';
  const asNum=v=>v==null?'—':v.toFixed(2);

  function srStats(s,o){
    const ta=srTotal(s),oTa=srTotal(o);
    return{
      pass : ratio(s.sr[1]+2*s.sr[2]+3*s.sr[3], ta),
      mtp  : ratio(s.sw-s.fbe, ta-o.a2a),
      fbso : ratio(s.fbk, ta-o.a2a),
      fbkr : ratio(s.fbk+s.a2k, s.sw+s.a2a),
      a2eff: ratio(s.a2k-s.a2e, s.a2a),
      share: ratio(ta, ta+oTa)
    };
  }

  /* ============ Master_Data — 45 columns, order fixed by the sheet ============ */
  const HEAD=['Date','School','Pair','Player','Partner','Opponent','Opponent Pair','Final Score',
    'Sets Won','Sets Lost','Points Earned (+)','Points Given (-)','Total SR Attempts',
    '0 SR Attempts','1 SR Attempts','2 SR Attempts','3 SR Attempts','SR BHE (2nd Ball)',
    'SR A2 Attempts','SR A2 Kills','SR A2 Errors','SR FB Swings (3rd Ball)','SR FB Kills (3rd Ball)',
    'SR FB Errors (3rd Ball)','SR BHE (2nd Ball) (Partner)','SR A2 Attempts (Partner)',
    'SR A2 Kills (Partner)','SR A2 Errors (Partner)','Serve Attempts','Aces','Serving Errors',
    'Knockouts','Points on Serve','Stuff Blocks','Tools','Digs -> Swing','Digs','Transition BHE',
    'Transition A2 Kills','Transition A2 Errors','Transition Kills (3rd Ball)',
    'Transition Hitting Errors (3rd Ball)','Transition BHE (Partner)','Transition A2 Kills (Partner)',
    'Transition A2 Errors (Partner)'];

  /* Sets won/lost come from how many sets were played plus the win/loss
     flag — the app never sees enough rallies to infer a winner. */
  function record(m){
    const parts=[];
    (m.scores||[]).forEach(s=>{
      const raw=String(s==null?'':s).trim();
      if(!raw)return;
      const x=raw.match(/(\d+)\s*[-–]\s*(\d+)/);
      parts.push(x?x[1]+'-'+x[2]:raw);
    });
    const n=parts.length,won=!!m.won;
    let w,l;
    if(n>=3){w=won?2:1;l=won?1:2;}
    else if(n===2){w=won?2:0;l=won?0:2;}
    else{w=won?n:0;l=won?0:n;}
    return{won:w,lost:l,final:parts.join('; ')};
  }

  function matchRows(m){
    const t=tally(m.rallies),rec=record(m),c=m.cfg;
    const pair=(c.a.num||'?')+'/'+(c.b.num||'?');
    return['a','b'].map(k=>{
      const s=t[k],o=t[other(k)],me=c[k],pa=c[other(k)];
      return[
        c.date,c.school,pair,'#'+me.num,'#'+pa.num,c.oppo,c.oppPair,rec.final,rec.won,rec.lost,
        s.pe,s.pg,srTotal(s),s.sr[0],s.sr[1],s.sr[2],s.sr[3],
        s.bhe,s.a2a,s.a2k,s.a2e,s.sw,s.fbk,s.fbe,
        o.bhe,o.a2a,o.a2k,o.a2e,
        s.sta,s.stk,s.ste,s.stko,s.pos,s.stsb,s.stt,
        s.stdts,s.std,                      /* col 36 is Digs -> Swing, col 37 is Digs */
        s.stbhe,s.sta2k,s.sta2e,s.sttk,s.stte,
        o.stbhe,o.sta2k,o.sta2e];
    });
  }

  function csv(list){
    const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
    const body=list.flatMap(matchRows);
    return[HEAD,...body].map(r=>r.map(q).join(',')).join('\n');
  }

  /* Column keys for match_stats, in the exact order matchRows() emits them.
     Kept adjacent to HEAD so the two cannot drift apart unnoticed. */
  const STAT_COLS=['played_on','school','pair','player','partner','opponent','opponent_pair',
    'final_score','sets_won','sets_lost','points_earned','points_given','sr_total_attempts',
    'sr_0','sr_1','sr_2','sr_3','sr_bhe','sr_a2_attempts','sr_a2_kills','sr_a2_errors',
    'sr_fb_swings','sr_fb_kills','sr_fb_errors','sr_bhe_partner','sr_a2_attempts_partner',
    'sr_a2_kills_partner','sr_a2_errors_partner','serve_attempts','aces','serving_errors',
    'knockouts','points_on_serve','stuff_blocks','tools','digs_to_swing','digs',
    'transition_bhe','transition_a2_kills','transition_a2_errors','transition_kills',
    'transition_hitting_errors','transition_bhe_partner','transition_a2_kills_partner',
    'transition_a2_errors_partner'];

  function statRows(m){
    return matchRows(m).map((row,i)=>{
      const o={match_id:m.id,slot:i===0?'a':'b'};
      STAT_COLS.forEach((k,j)=>{o[k]=row[j];});
      o.played_on=o.played_on||null;          // an empty string is not a date
      return o;
    });
  }

  /* ============ season filter ============ */
  function players(){const s=new Set();live().forEach(m=>['a','b'].forEach(k=>{
    if(m.cfg[k].num)s.add('#'+m.cfg[k].num);}));return[...s];}
  function opponents(){const s=new Set();live().forEach(m=>{if(m.cfg.oppo)s.add(m.cfg.oppo);});return[...s];}
  function seasonRows(){
    const f=S.filter,acc={};
    live().forEach(m=>{
      if(f.oppo&&m.cfg.oppo!==f.oppo)return;
      const t=tally(m.rallies);
      ['a','b'].forEach(k=>{const num='#'+m.cfg[k].num;
        if(f.player&&num!==f.player)return;
        const key=num+'|'+(m.cfg[k].name||'');
        if(!acc[key])acc[key]={num,name:m.cfg[k].name,games:0,st:blank()};
        acc[key].games++;add(acc[key].st,t[k]);});});
    return Object.values(acc).sort((x,y)=>srTotal(y.st)-srTotal(x.st));}

  /* ============================ SYNC ============================
     Local storage is always written first and never waits on the network.
     Everything here is best-effort reconciliation on top of that. */
  let syncTimer=null;

  function syncSoon(){
    if(!remote.configured()||!remote.signedIn())return;
    clearTimeout(syncTimer);
    syncTimer=setTimeout(()=>syncNow(true),4000);
  }

  function syncNow(quiet){
    if(!remote.configured()){S.sync.state='local';S.sync.pending=0;if(!quiet)render();return Promise.resolve();}
    if(!remote.signedIn()){S.sync.state='signedout';S.sync.pending=0;if(!quiet)render();return Promise.resolve();}
    clearTimeout(syncTimer);
    S.sync.busy=true;if(!quiet)render();
    return remote.sync(S.matches,statRows).then(res=>{
      S.sync.busy=false;
      S.sync.state=res.state;
      S.sync.pending=res.pending||0;
      S.sync.note=res.error||null;
      if(res.matches&&res.matches!==S.matches){
        let next=res.matches;
        /* Last-write-wins already protects local work, because an unsynced
           edit carries a newer timestamp than anything the server has. The
           one case it does not cover is a true conflict: the server is newer
           AND this device has unpushed changes to the same match. Mid-
           collection, keep what is in front of the collector rather than
           letting rallies vanish under them. */
        if(S.view==='collect'&&S.cur){
          const mine=S.matches.find(m=>m.id===S.cur);
          const theirs=next.find(m=>m.id===S.cur);
          if(mine&&theirs&&theirs!==mine&&remote.pending([mine]).length)
            next=next.map(m=>m.id===S.cur?mine:m);
        }
        S.matches=next;
        /* The open match may have been deleted on another device. */
        if(S.cur&&(!M()||M().deleted)){S.cur=null;S.pending=null;S.view='library';}
        writeLocal();
      }
      render();
    }).catch(e=>{
      S.sync.busy=false;S.sync.state='offline';S.sync.note=String(e&&e.message||e);
      S.sync.pending=remote.pending(S.matches).length;render();
    });
  }

  /* Counted live rather than cached, so the chip is honest the instant a
     rally is recorded rather than only after the next sync attempt. */
  function pendingCount(){
    if(!remote.configured()||!remote.signedIn())return 0;
    return remote.pending(S.matches).length;
  }
  function syncLabel(){
    const y=S.sync,p=pendingCount();
    if(y.busy)return'Syncing…';
    if(y.state==='local')return'On this device';
    if(y.state==='signedout')return'Not signed in';
    if(y.state==='offline')return p?('Offline — '+p+' to sync'):'Offline';
    return p?(p+' to sync'):'Synced';
  }
  function syncTone(){
    const y=S.sync;
    if(y.busy)return'var(--sand)';
    if(y.state==='offline')return'var(--q1)';
    if(y.state==='synced'&&!pendingCount())return'var(--kill)';
    return'var(--muted)';
  }

  /* ============================ ROUTING ============================
     Which side of the ball does the next rally start on? Derived from
     the rally that just ended, so undo and reopening a match reuse it. */
  function outcomeOf(r){
    if(r.kind==='oppServeError')return'won';
    if(r.kind==='st'){
      const e=(r.events||[])[(r.events||[]).length-1];
      if(!e)return'unknown';
      if(e.t==='serve')return e.result==='ace'?'won':e.result==='error'?'lost':'unknown';
      if(e.t==='block')return e.result==='stuff'?'won':'lost';
      if(e.t==='attack')return e.result==='kill'?'won':(e.result==='error'||e.result==='bhe')?'lost':'unknown';
      if(e.t==='opp')return e.result==='error'?'won':'lost';
      return'unknown';
    }
    if(r.rating===0)return'lost';
    if(r.second==='bhe')return'lost';
    if(r.second==='option'||r.second==='attack')
      return r.result==='kill'?'won':r.result==='error'?'lost':'unknown';
    return'unknown';                                   // 'none', or a rally that just continued
  }

  /* With ST tracking off there is no chooser and everything loops back
     to Serve Receive — byte-for-byte the v1 behaviour. */
  function screenFor(m){
    if(!m.cfg.trackST)return'sr1';
    const last=m.rallies[m.rallies.length-1];
    if(!last)return'chooser';
    const o=outcomeOf(last);
    return o==='won'?'stServe':o==='lost'?'sr1':'chooser';
  }

  /* ============================ RALLY ENTRY ============================ */
  function commit(rally){
    const m=M();
    m.rallies.push(rally);
    touch(m);
    S.pending=null;
    S.screen=screenFor(m);
    save();
    render(true);
  }
  function commitSR(extra){
    commit(Object.assign({id:uid()},S.pending,extra));
  }
  function pushST(e){S.pending.events.push(e);}
  function commitST(e){pushST(e);const r=S.pending;commit(r);}

  function undoLast(){
    const m=M();
    if(!m.rallies.length)return;
    m.rallies.pop();
    touch(m);
    S.pending=null;
    S.screen=screenFor(m);
    save();
    render();
  }

  function lastDigger(){
    const ev=S.pending.events;
    for(let i=ev.length-1;i>=0;i--)if(ev[i].t==='dig')return ev[i].by;
    return S.pending.server;
  }

  function back(){
    const p=S.pending;
    if(!p){return;}
    if(p.kind==='sr'){S.pending=null;S.screen='sr1';render();return;}
    const ev=p.events;
    if(S.screen==='stAttack'){
      while(ev.length&&ev[ev.length-1].t!=='dig')ev.pop();
      ev.pop();                                        // drop the dig itself
      S.screen='stRally';
    }else if(S.screen==='stRally'){
      if(ev.length>1){ev.pop();S.screen='stAttack';}    // undo an "attack, rally continues"
      else{S.pending=null;S.screen='stServe';}
    }
    render();
  }

  /* ============================ NARRATION ============================ */
  function describe(m,r){
    const nm=k=>'#'+m.cfg[k].num;
    if(r.kind==='oppServeError')return'Opponent missed serve';
    if(r.kind==='st')return describeST(m,r,nm);
    const p=nm(r.passer),q=nm(other(r.passer));
    if(r.rating===0)return p+' aced';
    const pass=p+' passed '+r.rating;
    if(r.second==='bhe')return pass+' · '+q+' handling error';
    if(r.second==='none')return pass+' · no attack, ball stays in play';
    if(r.second==='option')
      return pass+' · '+q+' on 2 · '+(r.result==='kill'?'kill':r.result==='error'?'error':'rally continues');
    return pass+' · '+p+' swings · '+(r.result==='kill'?'kill':r.result==='error'?'error':'rally continues');
  }

  function describeST(m,r,nm){
    const out=[];
    for(const e of r.events||[]){
      if(e.t==='serve')out.push(nm(r.server)+' '+({ace:'ace',error:'serving error',knockout:'knock out'}[e.result]||'serve'));
      else if(e.t==='block')out.push(nm(e.by)+(e.result==='stuff'?' stuff block':' tooled'));
      else if(e.t==='dig')out.push(nm(e.by)+(e.toSwing?' dig to swing':' dig'));
      else if(e.t==='attack'){
        const who=nm(e.by)+(e.type==='optionA2'?' on 2':'');
        out.push(who+' '+({kill:'kill',error:'error',bhe:'handling error'}[e.result]||'attack, rally continues'));
      }
      else if(e.t==='opp')out.push(e.result==='error'?'opponent error':'opponent kill');
    }
    return out.join(' · ')||'Serve/transition rally';
  }

  function tone(r){
    const o=outcomeOf(r);
    return o==='won'?'var(--kill)':o==='lost'?'var(--err)':'var(--live)';
  }

  /* ============================ RENDER ============================ */
  function render(flash){
    $.innerHTML = S.view==='library'?library()
                : S.view==='setup'  ?setup()
                : S.view==='end'    ?endResults()
                : collect();
    wire();
    if(flash){const s=$.querySelector('.stage');if(s){s.classList.add('flash');
      setTimeout(()=>s.classList.remove('flash'),400);}}
  }

  const alertBar=()=>S.err
    ?`<div class="alert"><span>${esc(S.err)}</span><button id="dismiss">Dismiss</button></div>`:'';

  /* ---- library ---- */
  function library(){
    const shown=live();
    const cards=shown.length?shown.map(m=>{
      const n=m.rallies.length,c=m.cfg;
      return`<div class="card ${m.id===S.cur?'on':''}">
        <div class="who"><b>${esc(c.a.num?'#'+c.a.num:'?')}/${esc(c.b.num||'?')} vs ${esc(c.oppo||'—')}</b>
        <span>${esc(c.date)} · ${n} rall${n===1?'y':'ies'}${c.trackST?' · SR+ST':' · SR'}${c.oppPair?' · '+esc(c.oppPair):''}</span></div>
        <button class="ghost" data-open="${m.id}">Open</button>
        <button class="ghost warn" data-del="${m.id}">Delete</button></div>`;}).join('')
      :`<div class="empty">No matches yet.<br>Start one and it stays here for the season.</div>`;
    return`${alertBar()}${account()}<div class="panel">
      <div><div class="eyebrow">Beach volleyball</div><h2>Matches</h2></div>
      ${cards}
      <button class="primary" id="newmatch">New match</button>
      <div class="pair">
        ${shown.length?`<button class="ghost" id="season" style="padding:13px">Season totals</button>
        <button class="ghost" id="exportall" style="padding:13px">Export spreadsheet</button>`:''}
      </div>
      <div class="pair">
        ${shown.length?`<button class="ghost" id="backup" style="padding:13px">Download backup</button>`:''}
        <button class="ghost" id="restore" style="padding:13px">Import backup</button>
      </div>
      <input type="file" id="restorefile" accept="application/json,.json" style="display:none">
    </div>
    ${S.sheet==='season'?seasonSheet():''}${S.sheet==='export'?exportSheet():''}`;}

  /* Signing in is optional. With no project configured, or signed out, the
     app is exactly what it was: fully working, stored on this device. */
  function account(){
    if(!remote.configured())return'';
    const chip=`<span class="chip" style="color:${syncTone()}">${esc(syncLabel())}</span>`;
    if(!remote.signedIn()){
      return`<div class="panel">
        <div><div class="eyebrow">Sync</div><h2>Sign in to use every device</h2></div>
        <div class="eyebrow">Matches stay on this device until you sign in. Nothing is lost either way.</div>
        <button class="primary" id="si-google">Continue with Google</button>
        ${S.sync.note?`<div class="eyebrow" style="color:#E9A49E">${esc(S.sync.note)}</div>`:''}
        <details>
          <summary class="eyebrow" style="cursor:pointer;padding:6px 0">Sign in by email instead</summary>
          <div style="display:flex;flex-direction:column;gap:9px;padding-top:9px">

              <input type="text" id="si-email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div>
            <button class="ghost" id="si-send" style="padding:13px">Email me a sign-in link</button>
          </div>
        </details>
      </div>`;}
    return`<div class="panel" style="gap:9px">
      <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <div class="eyebrow">Signed in</div>
          <b style="font-size:14px">${esc(remote.email()||'')}</b>
        </div>
        ${chip}
        <button class="ghost" id="si-sync">Sync now</button>
        <button class="ghost" id="si-out">Sign out</button>
      </div>
      ${S.sync.note?`<div class="eyebrow" style="color:#E9A49E">${esc(S.sync.note)}</div>`:''}
    </div>`;}

  /* ---- setup (also used for editing) ---- */
  function setup(){
    const d=S.draft,editing=!!d.id,dirty=editing&&(M()&&M().rallies.length);
    return`${alertBar()}<div class="panel">
      <div><div class="eyebrow">${editing?'Editing':'New match'}</div><h2>${editing?'Match details':'Who is playing?'}</h2></div>
      ${dirty?`<div class="eyebrow" style="color:#E9A49E">${M().rallies.length} rallies already logged — swapping a number reassigns all of them</div>`:''}
      <div class="fields">
        <div class="field"><label>Date</label><input id="f-date" type="date" value="${esc(d.cfg.date)}"></div>
        <div class="field"><label>Your school</label><input type="text" id="f-school" value="${esc(d.cfg.school)}" placeholder="TEXAS"></div>
        <div class="field"><label>Left side player #</label><input type="text" id="f-anum" value="${esc(d.cfg.a.num)}" placeholder="8"></div>
        <div class="field"><label>Left side player name</label><input type="text" id="f-aname" value="${esc(d.cfg.a.name)}" placeholder="Belardi"></div>
        <div class="field"><label>Right side player #</label><input type="text" id="f-bnum" value="${esc(d.cfg.b.num)}" placeholder="88"></div>
        <div class="field"><label>Right side player name</label><input type="text" id="f-bname" value="${esc(d.cfg.b.name)}" placeholder="Jackson"></div>
        <div class="field"><label>Opponent</label><input type="text" id="f-oppo" value="${esc(d.cfg.oppo)}" placeholder="UCLA"></div>
        <div class="field"><label>Opponent pair</label><input type="text" id="f-opair" value="${esc(d.cfg.oppPair)}" placeholder="18/21"></div>
        <label class="check" for="f-st">
          <input type="checkbox" id="f-st" ${d.cfg.trackST?'checked':''}>
          <span class="lbl"><b>Track Serve/Transition</b>
          <span>Serve receive is always tracked. Tick this to also stat rallies your team serves.</span></span>
        </label>
      </div>
      <div class="pair">
        <button class="ghost" id="cancel" style="padding:14px">Cancel</button>
        <button class="primary" id="savecfg">${editing?'Save':'Start collecting'}</button>
      </div></div>`;}

  /* ---- collect ---- */
  function collect(){
    return`${alertBar()}${bar()}<div class="split">
      <div class="stage">${stage()}${crumbs()}</div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">${totals()}${logPanel()}</div>
    </div>${S.sheet==='export'?exportSheet():''}`;}

  function bar(){const c=M().cfg;
    return`<div class="bar">
      <button class="ghost" id="tolib">Matches</button>
      <div class="matchup">#${esc(c.a.num)}/#${esc(c.b.num)} <em>vs</em> ${esc(c.oppo||'—')}</div>
      <div class="spacer"></div>
      <button class="ghost" id="edit">Edit</button>
      <button class="ghost" id="openexport">Export</button>
      <button class="ghost" id="endmatch">End match</button>
      ${remote.configured()?`<span class="chip" style="color:${syncTone()}">${esc(syncLabel())}</span>`:''}
      </div>`;}

  function stage(){
    switch(S.screen){
      case'chooser'  :return chooser();
      case'sr23'     :return secondBall();
      case'stServe'  :return stServe();
      case'stRally'  :return stRally();
      case'stAttack' :return stAttack();
      default        :return passGrid();
    }
  }

  function chooser(){
    return`<div><div class="eyebrow">Next rally</div><h2>Track next rally as</h2></div>
      <div class="duo">
        <button class="big" data-goto="sr1">Serve<br>Receive</button>
        <button class="big" data-goto="stServe">Serve /<br>Transition</button>
      </div>`;}

  const PASS_LABEL={3:'Forward pass',2:'Pass not forward, able to attack',
                    1:'Sent freeball / overpass',0:'Aced'};

  function passGrid(){
    const col=k=>{const p=P(k);
      return`<div class="col"><div class="cap"><b>#${esc(p.num)}</b><span>${esc(p.name||'passes')}</span></div>
        ${[3,2,1,0].map(n=>`<button class="pass p${n}" data-pass="${k}:${n}">
          <b>${n}</b><span>${esc(PASS_LABEL[n])}</span></button>`).join('')}</div>`;};
    return`<div><div class="eyebrow">Serve receive — 1st contact</div><h2>Pass</h2></div>
      <div class="duo">${col('a')}${col('b')}</div>
      <button class="wide won" id="oppmiss">Opponent misses serve</button>`;}

  function secondBall(){
    const pk=S.pending.passer;
    const hit=k=>{const p=P(k),isPasser=(k===pk);
      const head=`<div class="cap on"><b>#${esc(p.num)}</b><span>${isPasser?'3rd ball':'2nd ball'}</span></div>`;
      const btns=isPasser?
        `<button class="btn kill" data-out="attack:kill">Kill<small>Point earned</small></button>
         <button class="btn err"  data-out="attack:error">Attack error<small>Point given</small></button>
         <button class="btn dug"  data-out="attack:inplay">Swing<small>Rally continues</small></button>`
      : `<button class="btn kill" data-out="option:kill">A2 kill<small>Point earned</small></button>
         <button class="btn err"  data-out="option:error">A2 error<small>Point given</small></button>
         <button class="btn dug"  data-out="option:inplay">Attack on 2<small>Rally continues</small></button>
         <button class="btn bhe"  data-out="bhe:">Ball handling error<small>Point given</small></button>`;
      return`<div class="col">${head}${btns}</div>`;};
    return`<div><div class="eyebrow">#${esc(P(pk).num)} passed a ${S.pending.rating}</div><h2>2nd / 3rd contact</h2></div>
      <div class="duo">${hit('a')}${hit('b')}</div>
      <button class="wide" data-out="none:">No attack — ball stays in play</button>`;}

  function stServe(){
    const col=k=>{const p=P(k);
      return`<div class="col"><div class="cap"><b>#${esc(p.num)}</b><span>serves</span></div>
        <button class="btn kill" data-serve="${k}:ace">Ace<small>Point earned</small></button>
        <button class="btn err"  data-serve="${k}:error">Serving error<small>Point given</small></button>
        <button class="btn neutral" data-serve="${k}:knockout">Knock out<small>Begin rally</small></button>
        <button class="btn neutral" data-serve="${k}:inplay">Serve<small>Begin rally</small></button></div>`;};
    return`<div><div class="eyebrow">Serve / transition — serve</div><h2>Serve</h2></div>
      <div class="duo">${col('a')}${col('b')}</div>`;}

  function stRally(){
    const col=k=>{const p=P(k);
      return`<div class="col"><div class="cap"><b>#${esc(p.num)}</b><span>1st contact</span></div>
        <button class="btn kill" data-first="${k}:stuff">Stuff block<small>Point earned</small></button>
        <button class="btn err"  data-first="${k}:tooled">Tooled<small>Point given</small></button>
        <button class="btn neutral" data-first="${k}:digToSwing">Dig to swing<small>Attack in transition</small></button>
        <button class="btn neutral" data-first="${k}:dig">Dig<small>Attack in transition</small></button></div>`;};
    return`<div><div class="eyebrow">Serve / transition — #${esc(P(S.pending.server).num)} serving</div>
      <h2>1st contact in transition</h2></div>
      <div class="duo">${col('a')}${col('b')}</div>${oppButtons()}`;}

  function stAttack(){
    const dk=lastDigger();
    const hit=k=>{const p=P(k),isDigger=(k===dk);
      const head=`<div class="cap on"><b>#${esc(p.num)}</b><span>${isDigger?'attacks':'2nd ball'}</span></div>`;
      const btns=isDigger?
        `<button class="btn kill" data-att="attack:kill">Kill<small>Point earned</small></button>
         <button class="btn err"  data-att="attack:error">Hitting error<small>Point given</small></button>
         <button class="btn dug"  data-att="attack:continue">Attack<small>Rally continues</small></button>`
      : `<button class="btn kill" data-att="optionA2:kill">A2 kill<small>Point earned</small></button>
         <button class="btn err"  data-att="optionA2:error">A2 error<small>Point given</small></button>
         <button class="btn dug"  data-att="optionA2:continue">Attack on 2<small>Rally continues</small></button>
         <button class="btn bhe"  data-att="optionA2:bhe">Ball handling error<small>Point given</small></button>`;
      return`<div class="col">${head}${btns}</div>`;};
    return`<div><div class="eyebrow">Serve / transition — #${esc(P(dk).num)} dug it</div><h2>Attack in transition</h2></div>
      <div class="duo">${hit('a')}${hit('b')}</div>${oppButtons()}`;}

  /* Split from the docx's single "Opponent Kill/Error" so Points on Serve
     can be credited. Neither button touches points earned/given — those
     come only from our own players' actions on the ball. */
  function oppButtons(){
    return`<div class="pair">
      <button class="wide won"  data-opp="error">Opponent error</button>
      <button class="wide lost" data-opp="kill">Opponent kill</button></div>`;}

  function crumbs(){const m=M(),b=[];
    if(S.pending){
      if(S.pending.kind==='sr')b.push(`<span class="crumb">#${esc(P(S.pending.passer).num)} passed ${S.pending.rating}</span>`);
      else b.push(`<span class="crumb">${esc(describeST(m,S.pending,k=>'#'+m.cfg[k].num))}</span>`);
      b.push(`<button class="ghost" id="back">Back</button>`);
    }else{
      const last=m.rallies[m.rallies.length-1];
      if(last){b.push(`<span class="crumb dim">${esc(describe(m,last))}</span>`);
        b.push(`<button class="ghost" id="undo">Undo</button>`);}
      else b.push(`<span class="crumb dim">No rallies yet</span>`);
    }
    return`<div class="crumbs">${b.join('')}</div>`;}

  function statTable(A,B,la,lb,trackST){
    const r=(n,f,c)=>`<tr class="${c||''}"><td>${n}</td><td class="mono">${f(A)}</td><td class="mono">${f(B)}</td></tr>`;
    const g=n=>`<tr class="group"><td colspan="3">${n}</td></tr>`;
    const sa=srStats(A,B),sb=srStats(B,A);
    const rate=(n,key,fmt)=>`<tr class="rate"><td>${n}</td><td class="mono">${fmt(sa[key])}</td>
      <td class="mono">${fmt(sb[key])}</td></tr>`;
    const st=trackST?`
      ${g('Serve')}${r('Serve attempts',s=>s.sta)}${r('Aces',s=>s.stk)}${r('Serving errors',s=>s.ste)}
      ${r('Knockouts',s=>s.stko)}${r('Points on serve',s=>s.pos,'tot')}
      ${g('Transition')}${r('Stuff blocks',s=>s.stsb)}${r('Tools',s=>s.stt)}
      ${r('Digs',s=>s.std)}${r('Digs → swing',s=>s.stdts)}
      ${r('Transition kills',s=>s.sttk)}${r('Transition errors',s=>s.stte)}
      ${r('A2 kills',s=>s.sta2k)}${r('A2 errors',s=>s.sta2e)}${r('Handling errors',s=>s.stbhe)}`:'';
    return`<table><thead><tr><th></th><th>${la}</th><th>${lb}</th></tr></thead><tbody>
      ${g('Serve receive')}${r('Aced (0)',s=>s.sr[0])}${r('Sent freeball (1)',s=>s.sr[1])}
      ${r('Able to attack (2)',s=>s.sr[2])}${r('Forward (3)',s=>s.sr[3])}${r('Total attempts',srTotal,'tot')}
      ${g('2nd ball')}${r('Handling errors',s=>s.bhe)}${r('Option attempts',s=>s.a2a)}
      ${r('Option kills',s=>s.a2k)}${r('Option errors',s=>s.a2e)}
      ${g('3rd ball')}${r('Swings',s=>s.sw)}${r('Kills',s=>s.fbk)}${r('Errors',s=>s.fbe)}
      ${st}
      ${g('Points')}${r('Earned (+)',s=>s.pe)}${r('Given (−)',s=>s.pg,'tot')}
      ${g('Serve receive rates')}
      ${rate('Pass rating','pass',asNum)}
      ${rate('MTP %','mtp',asPct)}
      ${rate('3rd ball FBSO %','fbso',asPct)}
      ${rate('FB kill rate','fbkr',asPct)}
      ${rate('A2 efficiency %','a2eff',asPct)}
      ${rate('SR attempt share %','share',asPct)}
      </tbody></table>`;}

  function totals(){const m=M(),t=tally(m.rallies);
    return`<div class="panel"><div class="eyebrow">Live totals — this match</div>
      ${statTable(t.a,t.b,'#'+esc(m.cfg.a.num),'#'+esc(m.cfg.b.num),m.cfg.trackST)}</div>`;}

  function logPanel(){const m=M(),rs=[...m.rallies].reverse().slice(0,40);
    const body=rs.length?rs.map(r=>`<div class="entry"><span class="dot" style="background:${tone(r)}"></span>
      <span class="txt">${esc(describe(m,r))}</span></div>`).join('')
      :`<div class="empty">Every tap lands here.<br>Check the last few any time you lose the thread.</div>`;
    return`<div class="panel"><div class="eyebrow">Rally log — ${m.rallies.length} recorded</div>
      <div class="log">${body}</div></div>`;}

  /* ---- end results ---- */
  function endResults(){
    const m=M(),t=tally(m.rallies),rec=record(m);
    return`${alertBar()}<div class="panel">
      <div><div class="eyebrow">End results</div><h2>#${esc(m.cfg.a.num)}/#${esc(m.cfg.b.num)} vs ${esc(m.cfg.oppo||'—')}</h2></div>
      <div class="fields" style="grid-template-columns:1fr 1fr 1fr">
        ${[0,1,2].map(i=>`<div class="field"><label>Set ${i+1} score</label>
          <input type="text" id="sc${i}" value="${esc((m.scores||[])[i]||'')}" placeholder="21-18"></div>`).join('')}
      </div>
      <label class="check" for="f-won">
        <input type="checkbox" id="f-won" ${m.won?'checked':''}>
        <span class="lbl"><b>We won the match</b>
        <span>Sets won and lost come from this plus how many set scores you typed — currently ${rec.won}–${rec.lost}.</span></span>
      </label>
      <div class="panel" style="border:0;padding:0">
        <div class="eyebrow">Final totals</div>
        ${statTable(t.a,t.b,'#'+esc(m.cfg.a.num),'#'+esc(m.cfg.b.num),m.cfg.trackST)}
      </div>
      <div class="pair">
        <button class="ghost" id="backtocollect" style="padding:14px">Back to collecting</button>
        <button class="primary" id="saveend">Save &amp; finish</button>
      </div></div>`;}

  function exportSheet(){
    const one=S.view==='collect'||S.view==='end';
    const list=one?[M()]:live();
    return`<div class="modal" data-close="1"><div class="sheet">
      <h2>Master_Data</h2>
      <div class="eyebrow">${list.length} match${list.length===1?'':'es'} · ${list.length*2} rows · ${HEAD.length} columns</div>
      <textarea id="out" readonly>${esc(csv(list))}</textarea>
      <div class="pair">
        <button class="primary" id="copy">Copy</button>
        <button class="primary" id="dl">Download .csv</button></div>
      </div></div>`;}

  function seasonSheet(){
    const rows=seasonRows();
    const body=rows.length?rows.map(r=>{
      return`<tr><td>${esc(r.num)}${r.name?' '+esc(r.name):''}</td><td class="mono">${r.games}</td>
        <td class="mono">${srTotal(r.st)}</td><td class="mono">${r.st.sw}</td><td class="mono">${r.st.fbk}</td>
        <td class="mono">${r.st.a2a}</td><td class="mono">${r.st.sta}</td><td class="mono">${r.st.pos}</td>
        <td class="mono">${r.st.pe}</td><td class="mono">${r.st.pg}</td></tr>`;}).join('')
      :`<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:18px">Nothing matches that filter</td></tr>`;
    const opt=(v,cur)=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v||'All')}</option>`;
    return`<div class="modal" data-close="1"><div class="sheet">
      <h2>Season totals</h2>
      <div class="fields">
        <div class="field"><label>Player</label><select id="fp">${opt('',S.filter.player)}${players().map(p=>opt(p,S.filter.player)).join('')}</select></div>
        <div class="field"><label>Opponent</label><select id="fo">${opt('',S.filter.oppo)}${opponents().map(o=>opt(o,S.filter.oppo)).join('')}</select></div>
      </div>
      <table><thead><tr><th>Player</th><th>G</th><th>SR</th><th>Sw</th><th>K</th><th>A2</th><th>Srv</th><th>POS</th><th>+</th><th>−</th></tr></thead>
      <tbody>${body}</tbody></table>
      <div class="eyebrow">Raw totals — rates are per match, computed from these counts</div></div></div>`;}

  /* ============================ EVENTS ============================ */
  function wire(){
    const on=(s,f)=>$.querySelectorAll(s).forEach(e=>e.addEventListener('click',f));
    const el=i=>$.querySelector('#'+i);
    const blankCfg=()=>({date:new Date().toISOString().slice(0,10),school:'',oppo:'',oppPair:'',
                         trackST:false,a:{num:'',name:''},b:{num:'',name:''}});

    on('[data-close]',e=>{if(e.target===e.currentTarget){S.sheet=null;render();}});
    if(el('dismiss'))el('dismiss').addEventListener('click',()=>{S.err=null;render();});

    if(S.view==='library'){
      el('newmatch').addEventListener('click',()=>{
        const prev=live()[live().length-1];
        const cfg=blankCfg();
        if(prev){cfg.school=prev.cfg.school;cfg.a={...prev.cfg.a};cfg.b={...prev.cfg.b};
                 cfg.trackST=!!prev.cfg.trackST;}
        S.draft={id:null,cfg};S.view='setup';render();});
      on('[data-open]',e=>{S.cur=e.currentTarget.dataset.open;S.view='collect';S.pending=null;
        S.screen=screenFor(M());save();render();});
      on('[data-del]',e=>{const id=e.currentTarget.dataset.del;
        if(!confirm('Delete this match and its rallies?'))return;
        const m=S.matches.find(x=>x.id===id);
        if(m){m.deleted=true;m.rallies=[];touch(m);}   // tombstone, not a removal
        if(S.cur===id)S.cur=null;save();syncSoon();render();});
      if(el('season'))el('season').addEventListener('click',()=>{S.sheet='season';render();});
      if(el('exportall'))el('exportall').addEventListener('click',()=>{S.sheet='export';render();});
      if(el('fp'))el('fp').addEventListener('change',e=>{S.filter.player=e.target.value;render();});
      if(el('fo'))el('fo').addEventListener('change',e=>{S.filter.oppo=e.target.value;render();});
      if(el('backup'))el('backup').addEventListener('click',()=>dl(
        JSON.stringify({schemaVersion:SCHEMA,matches:S.matches,cur:S.cur},null,2),
        'bvstat-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json'));
      if(el('si-google'))el('si-google').addEventListener('click',()=>{
        S.sync.note='Opening Google…';render();
        remote.signInWithProvider('google');});
      if(el('si-send'))el('si-send').addEventListener('click',()=>{
        const addr=(el('si-email').value||'').trim();
        if(!addr){S.sync.note='Enter your email first.';render();return;}
        S.sync.note='Sending…';render();
        remote.sendMagicLink(addr).then(r=>{
          S.sync.note=r.ok?('Check '+addr+' for the link. Open it on this device.'):r.error;
          render();});});
      if(el('si-sync'))el('si-sync').addEventListener('click',()=>syncNow());
      if(el('si-out'))el('si-out').addEventListener('click',()=>{
        if(!confirm('Sign out? Matches stay on this device.'))return;
        remote.signOut();S.sync.state='signedout';S.sync.pending=0;S.sync.note=null;render();});
      if(el('restore'))el('restore').addEventListener('click',()=>el('restorefile').click());
      if(el('restorefile'))el('restorefile').addEventListener('change',e=>{
        const f=e.target.files&&e.target.files[0];if(!f)return;
        const rd=new FileReader();
        rd.onload=()=>{
          let d;
          try{d=JSON.parse(rd.result);}
          catch(err){S.err='That file is not valid JSON.';render();return;}
          if(!validBackup(d)){S.err='That file does not look like a stat backup.';render();return;}
          if(S.matches.length&&!confirm('Replace all '+S.matches.length+' match(es) on this device with the backup?'))return;
          adopt(d);S.view='library';save();render();};
        rd.onerror=()=>{S.err='Could not read that file.';render();};
        rd.readAsText(f);});
      hookExport(el);
      return;}

    if(S.view==='setup'){
      el('cancel').addEventListener('click',()=>{S.view=S.draft.id?'collect':'library';S.draft=null;render();});
      el('savecfg').addEventListener('click',()=>{
        const v=i=>(el(i)||{}).value||'';
        const cfg={date:v('f-date'),school:v('f-school').toUpperCase(),oppo:v('f-oppo').toUpperCase(),
          oppPair:v('f-opair'),trackST:!!(el('f-st')&&el('f-st').checked),
          a:{num:v('f-anum'),name:v('f-aname')},b:{num:v('f-bnum'),name:v('f-bname')}};
        if(!cfg.a.num||!cfg.b.num){alert('Both player numbers are needed — they label every button.');return;}
        if(S.draft.id){M().cfg=cfg;touch(M());S.screen=screenFor(M());}
        else{const m={id:uid(),cfg,scores:['','',''],won:false,rallies:[],
                      updatedAt:Date.now(),owner:null,deleted:false};
             S.matches.push(m);S.cur=m.id;S.screen=screenFor(m);}
        S.pending=null;S.draft=null;S.view='collect';save();render();});
      return;}

    if(S.view==='end'){
      el('backtocollect').addEventListener('click',()=>{S.view='collect';render();});
      el('saveend').addEventListener('click',()=>{
        const m=M();
        m.scores=[0,1,2].map(i=>el('sc'+i).value);
        m.won=!!el('f-won').checked;
        touch(m);save();syncNow();S.view='library';S.pending=null;render();});
      [0,1,2].forEach(i=>{const f=el('sc'+i);if(f)f.addEventListener('input',()=>{
        M().scores=[0,1,2].map(j=>el('sc'+j).value);M().won=!!el('f-won').checked;touch(M());save();});});
      if(el('f-won'))el('f-won').addEventListener('change',()=>{
        M().scores=[0,1,2].map(j=>el('sc'+j).value);M().won=!!el('f-won').checked;touch(M());save();render();});
      return;}

    /* ---- collect ---- */
    el('tolib').addEventListener('click',()=>{S.view='library';S.pending=null;S.sheet=null;render();});
    el('edit').addEventListener('click',()=>{S.draft={id:S.cur,cfg:JSON.parse(JSON.stringify(M().cfg))};
      S.view='setup';S.pending=null;render();});
    el('endmatch').addEventListener('click',()=>{S.view='end';S.pending=null;render();});
    if(el('openexport'))el('openexport').addEventListener('click',()=>{S.sheet='export';render();});

    on('[data-goto]',e=>{S.screen=e.currentTarget.dataset.goto;render();});

    /* serve receive */
    on('[data-pass]',e=>{const[k,n]=e.currentTarget.dataset.pass.split(':');
      S.pending={kind:'sr',passer:k,rating:+n};
      if(+n===0)commitSR({second:null,result:null});else{S.screen='sr23';render();}});
    on('[data-out]',e=>{const[sec,res]=e.currentTarget.dataset.out.split(':');
      commitSR({second:sec,result:res||null});});
    if(el('oppmiss'))el('oppmiss').addEventListener('click',()=>{
      commit({id:uid(),kind:'oppServeError'});});

    /* serve / transition */
    on('[data-serve]',e=>{const[k,res]=e.currentTarget.dataset.serve.split(':');
      S.pending={id:uid(),kind:'st',server:k,events:[]};
      if(res==='ace'||res==='error')commitST({t:'serve',result:res});
      else{pushST({t:'serve',result:res});S.screen='stRally';render();}});
    on('[data-first]',e=>{const[k,act]=e.currentTarget.dataset.first.split(':');
      if(act==='stuff'||act==='tooled')commitST({t:'block',by:k,result:act});
      else{pushST({t:'dig',by:k,toSwing:act==='digToSwing'});S.screen='stAttack';render();}});
    on('[data-att]',e=>{const[type,res]=e.currentTarget.dataset.att.split(':');
      const by=type==='optionA2'?other(lastDigger()):lastDigger();
      if(res==='continue'){pushST({t:'attack',by,type,result:res});S.screen='stRally';render();}
      else commitST({t:'attack',by,type,result:res});});
    on('[data-opp]',e=>{const res=e.currentTarget.dataset.opp;
      if(!S.pending)return;
      commitST({t:'opp',result:res});});

    if(el('back'))el('back').addEventListener('click',back);
    if(el('undo'))el('undo').addEventListener('click',undoLast);
    hookExport(el);
  }

  function validBackup(d){
    return!!d&&Array.isArray(d.matches)&&d.matches.every(m=>m&&typeof m==='object'&&
      (m.rallies===undefined||Array.isArray(m.rallies)));
  }

  function dl(text,name,type){
    const b=new Blob([text],{type:type||'text/csv'}),u=URL.createObjectURL(b),
      a=document.createElement('a');a.href=u;a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1000);}

  function hookExport(el){
    if(el('copy'))el('copy').addEventListener('click',()=>{
      const list=(S.view==='collect'||S.view==='end')?[M()]:live(),txt=csv(list);
      const t=el('out');t.select();t.setSelectionRange(0,99999);
      try{navigator.clipboard.writeText(txt);}catch(e){document.execCommand('copy');}
      el('copy').textContent='Copied';});
    if(el('dl'))el('dl').addEventListener('click',()=>{
      const one=S.view==='collect'||S.view==='end',list=one?[M()]:live();
      const n=one?`${M().cfg.school||'match'}_${M().cfg.date}_${M().cfg.a.num}-${M().cfg.b.num}.csv`:'Master_Data.csv';
      dl(csv(list),n);});
  }

  /* Exposed for the automated verification harness — not used by the UI. */
  window.BV={tally,matchRows,csv,record,HEAD,srStats,outcomeOf,blank,add,srTotal,pendingCount,
             statRows,STAT_COLS,live,touch,remote,syncNow,SCHEMA,
             state:S,render,save,load};

  load();
  /* A magic-link redirect lands back here with tokens in the fragment. */
  if(remote.configured()){
    try{
      const landed=remote.adoptRedirect();
      if(landed&&landed.error)S.sync.note=landed.error;
    }catch(e){}
    S.sync.state=remote.signedIn()?'synced':'signedout';
  }
  render();
  if(remote.configured()&&remote.signedIn())syncNow(true);
  window.addEventListener('online',()=>syncNow(true));
})();
</script>

<script>
/* Registered separately so a service-worker failure can never stop the
   collector from running — it degrades to an ordinary online page. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
